[package]
name = "store"
version = "1.0.0"
authors = ["Near Inc <hello@near.org>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.29.1"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-sandbox = "0.3"
near-api = "0.8.6"
cargo-near-build = "0.11.5"
tokio = { version = "1.38.0", features = ["full"] }
serde_json = "1.0.120"

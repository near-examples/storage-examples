name: Tests
on:
  repository_dispatch:
    types: [tests-report]
  push:
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: collections-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install contract build tooling
        run: cargo install cargo-near --version 0.21.1 --locked --no-default-features
      - name: Test Rust collections
        run: cargo test --locked
